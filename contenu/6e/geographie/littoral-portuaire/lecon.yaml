chapitres:
  # ---------------------------------------------------------------------------------------------
  - titre: Rotterdam, un port géant
    ensemble:
      type: mosaique
    formule: port = lien entre la mer et la terre
    cartes:
      - picto: lieu
        motCle: Rotterdam
        phrases:
          - Rotterdam est aux Pays-Bas, près de la mer du Nord, là où arrivent le Rhin et la Meuse.
        image:
          aGenerer: >-
            Carte de localisation sans aucun texte, format 4:3 paysage, style carte d'atlas scolaire
            simple et propre, vue du nord-ouest de l'Europe. Mer en bleu clair, terres en beige clair,
            frontières en fins traits gris. Placer précisément : la mer du Nord, grande surface bleue,
            centrée vers 35 % de la largeur et 22 % de la hauteur ; la côte est de la Grande-Bretagne à
            gauche, vers 15 % de la largeur et 35 % de la hauteur ; un gros point rouge pour Rotterdam,
            sur la côte des Pays-Bas, vers 50 % de la largeur et 55 % de la hauteur ; le Rhin, trait bleu
            foncé épais, qui part de Rotterdam et monte vers l'est puis le sud-est jusqu'en Allemagne,
            passant vers 72 % de la largeur et 68 % de la hauteur ; l'Allemagne vers 80 % de la largeur
            et 40 % de la hauteur ; le nord de la France vers 30 % de la largeur et 88 % de la hauteur.
            Ne doit pas figurer : texte, lettre, chiffre, nom de lieu, légende écrite, rose des vents
            avec lettres, échelle chiffrée, drapeau.
          alt: >-
            Carte du nord-ouest de l'Europe : Rotterdam, point rouge sur la côte des Pays-Bas, au bord de
            la mer du Nord ; le Rhin, trait bleu foncé, part de Rotterdam vers l'Allemagne.
          etiquettes:
            - texte: mer du Nord
              x: 35
              y: 22
            - texte: Royaume-Uni
              x: 15
              y: 35
            - texte: Rotterdam
              x: 50
              y: 55
            - texte: Rhin
              x: 72
              y: 68
            - texte: Allemagne
              x: 80
              y: 40
            - texte: France
              x: 30
              y: 88
      - picto: un
        motCle: premier port d'Europe
        phrases:
          - "C'est le plus grand port d'Europe : environ 428 millions de tonnes de marchandises en 2025."
        image:
          aGenerer: >-
            Photographie aérienne réaliste d'aujourd'hui, format 4:3 paysage, prise de haut par temps
            clair. Un immense port européen au bord de la mer du Nord : de longs bassins rectangulaires,
            des quais où sont amarrés des porte-conteneurs, des milliers de conteneurs colorés empilés,
            des rangées de grues bleues, des cuves blanches de pétrole au second plan, la mer à
            l'horizon. Ne doit pas figurer : texte, lettre, chiffre, logo, nom de compagnie sur les
            conteneurs ou les navires, drapeau lisible, panneau.
          alt: Vue aérienne d'un immense port, avec des bassins, des porte-conteneurs, des piles de conteneurs et des grues.
      - picto: fleche
        motCle: un port qui avance
        phrases:
          - Le port est né en ville, puis s'est étiré vers la mer, sur plus de 40 km.
        enSavoirPlus: >-
          Les navires sont de plus en plus grands : il leur faut de la place et des bassins profonds,
          près de la mer.
        image:
          aGenerer: >-
            Croquis géographique sans aucun texte, format 4:3 paysage, vue de dessus, style de croquis
            de manuel scolaire aux aplats de couleurs simples. Un fleuve bleu traverse l'image de droite à
            gauche et se jette dans la mer (bleu plus foncé) sur le bord gauche. Le long du fleuve, de
            droite à gauche : une ville en orange (rues fines), centrée vers 86 % de la largeur et 45 %
            de la hauteur ; puis des zones portuaires en gris, de plus en plus grandes vers la mer, avec
            des bassins en forme de doigts : une zone vers 62 % de la largeur et 64 % de la hauteur, une
            autre vers 35 % de la largeur et 50 % de la hauteur ; enfin, une grande terre neuve en gris
            avancée dans la mer, vers 12 % de la largeur et 34 % de la hauteur. Une large flèche rouge
            pointe de la ville vers la mer, en bas de l'image. Ne doit pas figurer : texte, lettre,
            chiffre, nom de lieu, légende écrite, échelle chiffrée.
          alt: >-
            Croquis du port de Rotterdam : la ville en orange à droite, puis des zones portuaires grises
            de plus en plus grandes jusqu'à une terre neuve avancée dans la mer, à gauche ; une flèche
            rouge va de la ville vers la mer.
          etiquettes:
            - texte: centre-ville
              x: 86
              y: 45
            - texte: Botlek
              x: 62
              y: 64
            - texte: Europoort
              x: 35
              y: 50
            - texte: Maasvlakte 2
              x: 12
              y: 34
            - texte: mer du Nord
              x: 8
              y: 80
      - picto: grue
        motCle: terminal à conteneurs
        phrases:
          - Au terminal, d'immenses grues déchargent les conteneurs des navires et les posent à terre.
        enSavoirPlus: >-
          Sur Maasvlakte 2, des grues commandées à distance et des véhicules sans chauffeur déplacent les
          conteneurs, jour et nuit.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage, vue depuis le quai. Un très grand
            porte-conteneurs amarré le long d'un quai ; trois grandes grues portiques bleues penchées
            au-dessus du navire ; l'une soulève un conteneur rouge uni ; au sol, des piles de conteneurs
            unis de couleurs variées et un petit véhicule automatique qui transporte un conteneur. Ciel
            clair. Ne doit pas figurer : texte, lettre, chiffre, logo, nom de compagnie sur les
            conteneurs ou le navire, drapeau lisible, panneau.
          alt: Des grues portiques bleues déchargent les conteneurs d'un très grand navire le long d'un quai.
      - picto: vague
        motCle: Maasvlakte 2
        phrases:
          - Maasvlakte 2 est une terre neuve, faite avec du sable pris au fond de la mer.
        enSavoirPlus: >-
          Environ 2 000 hectares ont été gagnés sur la mer du Nord, derrière une longue digue. Le nouveau
          port a ouvert en 2013.
        image:
          aGenerer: >-
            Photographie aérienne réaliste d'aujourd'hui, format 4:3 paysage. Une drague, grand navire de
            travaux, projette en l'air un arc de sable mêlé d'eau vers une nouvelle terre de sable clair
            qui avance dans une mer grise et calme ; au fond, sur la terre déjà faite, des quais et
            quelques grues. Ne doit pas figurer : texte, lettre, chiffre, logo, nom sur la coque, drapeau
            lisible, panneau.
          alt: Une drague projette un arc de sable pour fabriquer une nouvelle terre dans la mer.
      - picto: usine
        motCle: usines
        phrases:
          - Raffineries et usines chimiques sont installées au bord des bassins, tout près des navires.
        enSavoirPlus: >-
          Une raffinerie transforme le pétrole brut, arrivé par la mer, en carburants comme l'essence.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Au bord d'un bassin portuaire, une
            raffinerie : tours de distillation métalliques, tuyaux, grandes cuves blanches rondes et
            quelques cheminées ; un navire pétrolier est amarré au quai devant. Lumière de fin d'après-midi.
            Ne doit pas figurer : texte, lettre, chiffre, logo, nom de compagnie, panneau, drapeau
            lisible.
          alt: Une raffinerie avec ses tours, ses tuyaux et ses cuves blanches, au bord d'un bassin où est amarré un pétrolier.
      - picto: bateau
        motCle: péniche
        phrases:
          - Des péniches remontent le Rhin pour livrer les marchandises jusqu'en Allemagne.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Sur un large fleuve européen, une
            longue péniche chargée de trois rangées de conteneurs unis colorés navigue vers l'amont ;
            berges vertes avec digues, quelques éoliennes et un village au loin. Ne doit pas figurer :
            texte, lettre, chiffre, logo, nom sur la coque, drapeau lisible, panneau.
          alt: Une longue péniche chargée de conteneurs navigue sur un large fleuve.
      - picto: groupe
        motCle: travailler
        phrases:
          - En 2022, environ 193 000 emplois de la région de Rotterdam dépendaient du port.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Sur un quai de port, au petit matin,
            quatre travailleurs portuaires d'âges et d'origines variés, hommes et femmes, en casque et
            gilet orange uni, discutent devant des piles de conteneurs ; l'une tient une tablette. Ils ont
            l'air concentrés et détendus. Ne doit pas figurer : texte, lettre, chiffre, logo, badge
            lisible, inscription sur les gilets, panneau.
          alt: Quatre travailleurs du port, en casque et gilet orange, discutent sur un quai devant des conteneurs.
      - picto: ville
        motCle: ville portuaire
        phrases:
          - "Rotterdam, environ 674 000 habitants en 2026, est une ville portuaire : elle vit avec son port."
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Une grande ville portuaire des
            Pays-Bas au bord d'un large fleuve : tours modernes, un grand pont à haubans blanc qui
            traverse le fleuve, un bateau-taxi jaune uni sur l'eau ; au premier plan, sur le quai, des
            habitants marchent et font du vélo. Fin d'après-midi ensoleillée. Ne doit pas figurer : texte,
            lettre, chiffre, logo, enseigne, panneau, plaque lisible.
          alt: Une grande ville au bord d'un fleuve, avec des tours, un pont blanc et des habitants à vélo sur le quai.
      - picto: soleil
        motCle: loisirs
        phrases:
          - Sur Maasvlakte 2, une plage et des dunes accueillent promeneurs et baigneurs, à côté des terminaux.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Une longue plage de sable clair au
            bord de la mer du Nord, en été : quelques familles, des promeneurs et un cerf-volant ; des
            dunes avec des herbes à droite ; à l'horizon, à gauche, des grues de port et un
            porte-conteneurs. Ne doit pas figurer : texte, lettre, chiffre, logo, panneau, drapeau
            lisible, marque sur les objets de plage.
          alt: Une plage avec des familles et des promeneurs, avec des grues de port à l'horizon.
      - picto: oiseau
        motCle: nature protégée
        phrases:
          - "En échange, une grande zone de mer est protégée : oiseaux et phoques peuvent s'y reposer."
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Sur un banc de sable découvert par
            la marée basse, au bord de la mer du Nord, une dizaine de phoques se reposent ; des oiseaux de
            mer (sternes, huîtriers pies) se posent autour. Ciel gris clair. Aucune construction proche.
            Ne doit pas figurer : texte, lettre, chiffre, panneau, bouée écrite, humain.
          alt: Des phoques se reposent sur un banc de sable, entourés d'oiseaux de mer.
    questions:
      - question: Où se trouve Rotterdam ?
        reponse: Aux Pays-Bas, près de la mer du Nord, là où arrivent le Rhin et la Meuse.
      - question: Pourquoi le port s'est-il agrandi vers la mer ?
        reponse: Pour avoir de la place et des bassins profonds pour les très grands navires.
      - question: Comment a-t-on fabriqué Maasvlakte 2 ?
        reponse: Avec du sable pris au fond de la mer, pour créer une terre neuve.

  # ---------------------------------------------------------------------------------------------
  - titre: Le Havre, un port français
    ensemble:
      type: mosaique
    formule: ZIP = port + usines
    cartes:
      - picto: lieu
        motCle: Le Havre
        phrases:
          - Le Havre est en Normandie, là où la Seine se jette dans la Manche.
        image:
          aGenerer: >-
            Carte de localisation sans aucun texte, format 4:3 paysage, style carte d'atlas scolaire
            simple et propre, vue du nord-ouest de la France. Mer en bleu clair, terres en beige clair.
            Placer précisément : la Manche, grande surface bleue, centrée vers 30 % de la largeur et 20 %
            de la hauteur ; un gros point rouge pour Le Havre, sur la côte, à l'embouchure de la Seine,
            vers 38 % de la largeur et 42 % de la hauteur ; la Seine, trait bleu foncé épais et sinueux,
            qui part du Havre vers l'est et le sud-est ; un point noir pour Rouen sur la Seine vers 62 %
            de la largeur et 56 % de la hauteur ; un point noir plus gros pour Paris sur la Seine vers
            85 % de la largeur et 74 % de la hauteur. Ne doit pas figurer : texte, lettre, chiffre, nom
            de lieu, légende écrite, échelle chiffrée, drapeau.
          alt: >-
            Carte du nord-ouest de la France : Le Havre, point rouge au bord de la Manche, là où arrive
            la Seine ; la Seine, trait bleu foncé, remonte vers Rouen puis Paris, deux points noirs.
          etiquettes:
            - texte: Manche
              x: 30
              y: 20
            - texte: Le Havre
              x: 38
              y: 42
            - texte: Rouen
              x: 62
              y: 56
            - texte: Paris
              x: 85
              y: 74
      - picto: conteneur
        motCle: premier port à conteneurs
        phrases:
          - Le Havre est le premier port de France pour les conteneurs.
        enSavoirPlus: >-
          Avec Rouen et Paris, il forme le port HAROPA, qui a traité environ 3,2 millions d'EVP en 2025
          (un EVP = un conteneur de 6 m).
        image:
          aGenerer: >-
            Photographie aérienne réaliste d'aujourd'hui, format 4:3 paysage. Un grand terminal à
            conteneurs en France, au bord d'un estuaire : un long quai droit, deux porte-conteneurs
            amarrés, des grues portiques, des milliers de conteneurs colorés unis rangés en blocs, des
            rails de train et des camions à l'arrière. Ne doit pas figurer : texte, lettre, chiffre, logo,
            nom de compagnie sur les conteneurs ou les navires, drapeau lisible, panneau.
          alt: Vue aérienne d'un grand terminal à conteneurs, avec deux navires, des grues, des conteneurs, des trains et des camions.
      - picto: grue
        motCle: Port 2000
        phrases:
          - Port 2000, ouvert en 2006, a été construit sur la mer pour accueillir les plus grands navires.
        image:
          aGenerer: >-
            Photographie aérienne réaliste d'aujourd'hui, format 4:3 paysage, prise de haut. Un port à
