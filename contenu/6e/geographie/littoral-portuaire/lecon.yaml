      - picto: goutte
        motCle: raffinerie
        phrases:
          - À Gonfreville-l'Orcher, une grande raffinerie transforme le pétrole arrivé par bateau en carburants.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage, vue de loin. Une grande raffinerie
            dans une plaine au bord d'un estuaire : tours métalliques, réseau de tuyaux, dizaines de
            cuves rondes blanches, une torche avec une petite flamme ; au premier plan, une prairie et
            une route. Ne doit pas figurer : texte, lettre, chiffre, logo, nom de compagnie, panneau,
            drapeau lisible.
          alt: Une grande raffinerie avec ses tours, ses tuyaux et ses cuves blanches, vue depuis une prairie.
      - picto: groupe
        motCle: emplois
        phrases:
          - En 2021, environ 30 000 salariés travaillaient dans le port et les usines de la ZIP.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Changement d'équipe à l'entrée d'une
            usine portuaire, en fin de journée : des ouvriers et ouvrières en tenue de travail unie et
            casque arrivent à pied et à vélo, d'autres repartent ; derrière eux, des cuves et des tuyaux.
            Ne doit pas figurer : texte, lettre, chiffre, logo, badge lisible, panneau, enseigne.
          alt: Des ouvriers et ouvrières en tenue de travail arrivent et repartent à l'entrée d'une usine du port.
      - picto: personne
        motCle: docker
        phrases:
          - Les dockers chargent et déchargent les navires, souvent aux commandes d'immenses grues.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Un docker en casque blanc et gilet
            jaune uni, de profil, guide de la main un conteneur suspendu à une grue qui le pose sur la
            remorque d'un camion ; un deuxième docker observe à côté. Quai de port, ciel couvert. Ne doit
            pas figurer : texte, lettre, chiffre, logo, inscription sur les vêtements, nom sur le
            conteneur, plaque d'immatriculation lisible.
          alt: Un docker guide un conteneur que la grue pose sur un camion.
      - picto: ville
        motCle: habiter Le Havre
        phrases:
          - Le Havre compte environ 166 000 habitants en 2022 ; beaucoup vivent du port.
        enSavoirPlus: >-
          Détruit par les bombardements de 1944, le centre a été reconstruit par l'architecte Auguste
          Perret. Il est inscrit au patrimoine mondial de l'Unesco.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Une rue du centre du Havre bordée
            d'immeubles en béton clair aux formes simples et régulières, construits après la guerre ; des
            habitants marchent sur un large trottoir, un tramway moderne uni passe ; au fond, au bout de
            la rue, on devine des grues du port. Ne doit pas figurer : texte, lettre, chiffre, logo,
            enseigne, panneau, plaque lisible.
          alt: Une large rue bordée d'immeubles en béton clair, avec des habitants et un tramway, et des grues du port au fond.
      - picto: soleil
        motCle: plage
        phrases:
          - Tout près du port, la plage du Havre accueille baigneurs, promeneurs et sportifs.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Une plage de galets en Normandie en
            été, avec des cabines de plage blanches unies, des baigneurs et des promeneurs ; au loin, un
            porte-conteneurs passe sur la mer et l'on devine des grues de port à l'horizon. Ne doit pas
            figurer : texte, lettre, chiffre, logo, panneau, enseigne, drapeau lisible.
          alt: Une plage de galets avec des baigneurs et des cabines blanches, un porte-conteneurs au loin.
      - picto: oiseau
        motCle: réserve naturelle
        phrases:
          - Une réserve naturelle protège les oiseaux de l'estuaire, la large embouchure de la Seine, à côté du port.
        enSavoirPlus: >-
          La réserve a été créée en 1997. En échange de la place prise par Port 2000, une petite île a été
          construite pour que les oiseaux s'y reposent.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Des roselières et des vasières au
            bord d'un estuaire, à marée basse ; des aigrettes blanches et des avocettes se nourrissent
            dans la vase ; au loin, à l'horizon, la silhouette de grues de port et de cuves. Lumière douce
            du matin. Ne doit pas figurer : texte, lettre, chiffre, logo, panneau, humain.
          alt: Des oiseaux se nourrissent dans les vasières d'un estuaire, avec des grues de port au loin.
    questions:
      - question: Où se trouve Le Havre ?
        reponse: En Normandie, là où la Seine se jette dans la Manche.
      - question: Qu'est-ce qu'une ZIP ?
        reponse: Une zone industrialo-portuaire, qui réunit un port et des usines.
      - question: Qui partage le littoral du Havre ?
        reponse: Le port, les usines, les habitants, les baigneurs de la plage et les oiseaux de la réserve.

  # ---------------------------------------------------------------------------------------------
  - titre: Les littoraux industrialo-portuaires
    ensemble:
      type: mosaique
    formule: mondialisation = échanges par la mer
    cartes:
      - picto: vague
        motCle: littoral
        phrases:
          - Le littoral est l'espace où la terre et la mer se rencontrent.
        image:
          aGenerer: >-
            Photographie aérienne réaliste d'aujourd'hui, format 4:3 paysage. Une côte vue d'en haut : à
            gauche la mer bleue avec des vagues, au milieu une plage et des dunes, à droite des champs, un
            village et une route. La limite entre terre et mer est bien nette. Ne doit pas figurer :
            texte, lettre, chiffre, logo, panneau.
          alt: Une côte vue d'en haut, avec la mer, une plage, des dunes et un village.
      - picto: lieu
        motCle: port
        phrases:
          - Un port est un lieu aménagé pour que les navires s'abritent, chargent et déchargent.
        image:
          aGenerer: >-
            Photographie aérienne réaliste d'aujourd'hui, format 4:3 paysage. Un port vu d'en haut : une
            digue courbe protège des bassins calmes ; le long des quais, des navires de commerce sont
            amarrés ; des grues, des hangars et des entrepôts sont alignés derrière les quais. Ne doit pas
            figurer : texte, lettre, chiffre, logo, nom sur les navires, panneau.
          alt: Un port vu d'en haut, avec une digue, des bassins, des navires à quai et des grues.
      - picto: conteneur
        motCle: conteneur
        phrases:
          - Un conteneur est une grande boîte en métal, de taille standard, qui passe du navire au camion ou au train.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage, fond de quai. Un seul conteneur en
            métal ondulé bleu uni, portes ouvertes, posé sur la remorque d'un camion ; à l'intérieur, des
            cartons empilés. Lumière de jour. Ne doit pas figurer : texte, lettre, chiffre, logo, code
            peint sur le conteneur, plaque d'immatriculation lisible, panneau.
          alt: Un conteneur bleu ouvert, rempli de cartons, posé sur la remorque d'un camion.
      - picto: bateau
        motCle: porte-conteneurs
        phrases:
          - "Les plus grands porte-conteneurs mesurent environ 400 m de long : quatre terrains de football."
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage, vue de côté depuis la mer. Un
            gigantesque porte-conteneurs en pleine mer, chargé de conteneurs colorés unis empilés très
            haut, de la proue à la poupe ; un petit remorqueur à côté donne l'échelle. Mer calme, ciel
            clair. Ne doit pas figurer : texte, lettre, chiffre, logo, nom sur la coque, drapeau lisible.
          alt: Un gigantesque porte-conteneurs chargé de conteneurs colorés, à côté d'un petit remorqueur.
      - picto: globe
        motCle: mondialisation
        phrases:
          - "Avec la mondialisation, les pays échangent partout dans le monde : environ 80 % des marchandises voyagent par mer."
        enSavoirPlus: >-
          Ce chiffre vient de l'ONU (CNUCED). Les grands ports se trouvent surtout en Asie de l'Est, en
          Europe et en Amérique du Nord.
        image:
          aGenerer: >-
            Planisphère sans aucun texte, format 4:3 paysage, style carte d'atlas scolaire simple :
            océans en bleu clair, continents en beige clair. De grandes routes maritimes tracées en lignes
            rouges plus ou moins épaisses relient l'Asie de l'Est, l'Europe et l'Amérique du Nord, par
            l'océan Indien, la mer Rouge, la Méditerranée et l'Atlantique. Gros points noirs pour quatre
            ports : Rotterdam vers 50 % de la largeur et 20 % de la hauteur ; New York vers 28 % de la
            largeur et 34 % de la hauteur ; Shanghai vers 82 % de la largeur et 40 % de la hauteur ;
            Singapour vers 76 % de la largeur et 58 % de la hauteur. Ne doit pas figurer : texte, lettre,
            chiffre, nom de lieu, légende écrite, échelle chiffrée, drapeau.
          alt: >-
            Planisphère : de grandes routes maritimes en rouge relient l'Asie de l'Est, l'Europe et
            l'Amérique du Nord ; quatre ports en points noirs : Rotterdam, New York, Shanghai et Singapour.
          etiquettes:
            - texte: Rotterdam
              x: 50
              y: 20
            - texte: New York
              x: 28
              y: 34
            - texte: Shanghai
              x: 82
              y: 40
            - texte: Singapour
              x: 76
              y: 58
      - picto: usine
        motCle: zone industrialo-portuaire
        phrases:
          - Une ZIP réunit un port et des usines qui transforment les marchandises arrivées par la mer.
        image:
          aGenerer: >-
            Photographie aérienne réaliste d'aujourd'hui, format 4:3 paysage. Une zone
            industrialo-portuaire : au premier plan un bassin avec un vraquier déchargé par une grue ; le
            long des quais, une aciérie aux grands hangars, des cuves de pétrole, des tas de charbon et de
            minerai ; des voies ferrées et une autoroute à l'arrière. Ne doit pas figurer : texte,
            lettre, chiffre, logo, nom de compagnie, panneau, drapeau lisible.
          alt: Vue aérienne d'une zone de port et d'usines, avec un navire, des hangars, des cuves et des tas de minerai.
      - picto: digue
        motCle: terre-plein
        phrases:
          - Pour s'agrandir, un port crée des terre-pleins, des terres neuves faites de sable ou de pierres.
        image:
          aGenerer: >-
            Photographie aérienne réaliste d'aujourd'hui, format 4:3 paysage. Un chantier de port : un
            grand terrain plat de sable clair, tout neuf, avancé dans la mer, bordé d'une digue de gros
            blocs de pierre ; des bulldozers jaunes unis l'aplanissent ; la mer bleue l'entoure sur trois
            côtés. Ne doit pas figurer : texte, lettre, chiffre, logo, nom sur les engins, panneau.
          alt: Un grand terrain de sable tout neuf avancé dans la mer, bordé d'une digue de blocs de pierre.
      - picto: digue
        motCle: polder
        phrases:
          - Aux Pays-Bas, un polder est une terre gagnée sur la mer, plus basse qu'elle, protégée par des digues.
        enSavoirPlus: >-
          Maasvlakte 2 n'est pas un polder : son sable a été monté plus haut que la mer. C'est un
          terre-plein.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage, aux Pays-Bas. À droite, une haute
            digue herbeuse ; derrière elle, à droite, on voit la mer, plus haute que les champs. À gauche,
            en contrebas, un polder plat : prairies vertes découpées par des fossés droits remplis d'eau,
            des vaches, une ferme et un moulin. Ne doit pas figurer : texte, lettre, chiffre, logo,
            panneau, drapeau lisible.
          alt: Un polder plat avec des prairies et des fossés, en contrebas d'une haute digue qui retient la mer.
      - picto: groupe
        motCle: emplois
        phrases:
          - "Le port fait vivre les habitants : dockers, ouvriers, marins, chauffeurs, mais aussi commerçants de la ville."
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Rue animée d'une ville portuaire en
            fin de journée : un chauffeur de camion, une ouvrière en tenue de travail et un marin en ciré
            uni marchent sur le trottoir ; un boulanger sert une cliente devant sa boutique ; au fond, des
            grues de port. Ne doit pas figurer : texte, lettre, chiffre, logo, enseigne, panneau, plaque
            lisible.
          alt: Une rue de ville portuaire avec un chauffeur, une ouvrière, un marin et un boulanger, des grues au fond.
      - picto: balance
        motCle: conflit d'usage
        phrases:
          - "Port, pêcheurs, promeneurs et protecteurs des oiseaux veulent le même littoral : c'est un conflit d'usage."
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Sur un même bout de côte : à gauche,
            un petit bateau de pêche ; au centre, des promeneurs sur un chemin au bord d'une vasière où se
            posent des oiseaux ; à droite, tout près, les cuves et les grues d'une zone portuaire. Le
            contraste entre nature, loisirs et industrie est bien visible. Ne doit pas figurer : texte,
            lettre, chiffre, logo, panneau, nom sur le bateau.
          alt: Sur la même côte, un bateau de pêche, des promeneurs, des oiseaux et, juste à côté, les cuves et les grues d'un port.
      - picto: goutte
        motCle: pollution
        phrases:
          - Usines et navires peuvent polluer l'air et l'eau ; camions et grues font du bruit.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Vue depuis la fenêtre d'un immeuble
            d'habitation : au loin, des cheminées d'usine portuaire rejettent des fumées grises dans le
            ciel ; plus près, une file de camions chargés de conteneurs roule sur une route. Ambiance
            grise. Ne doit pas figurer : texte, lettre, chiffre, logo, panneau, plaque lisible.
          alt: Depuis la fenêtre d'un immeuble, on voit des cheminées d'usine qui fument et une file de camions.
      - picto: arbre
        motCle: protéger
        phrases:
          - Des lois et des réserves naturelles protègent une partie du littoral, ses plantes et ses animaux.
        enSavoirPlus: >-
          En France, la loi Littoral de 1986 limite les constructions au bord de la mer.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Un littoral sauvage et protégé :
            dunes couvertes d'oyats, un sentier en planches de bois qui serpente vers la mer, une petite
            barrière basse en bois pour que les promeneurs restent sur le chemin ; une famille marche sur
            le sentier. Ne doit pas figurer : texte, lettre, chiffre, logo, panneau, enseigne.
          alt: Un sentier en planches traverse des dunes protégées jusqu'à la mer, avec une famille qui marche.
    questions:
      - question: Qu'est-ce qu'un littoral industrialo-portuaire ?
        reponse: Un littoral aménagé avec un grand port et des usines.
      - question: Pourquoi les ports comptent-ils dans la mondialisation ?
        reponse: Environ 80 % des marchandises échangées dans le monde voyagent par la mer.
      - question: Comment un port gagne-t-il de la place sur la mer ?
        reponse: Il crée des terre-pleins avec du sable ou des pierres, protégés par des digues.
      - question: Donne un exemple de conflit d'usage.
        reponse: Le port veut s'agrandir là où vivent des oiseaux protégés.
