# Leçon en brouillon : toutes les images sont à générer (description de ce qu'elles montrent).
# Programme : cycle 3, classe de 6e, géographie, thème 3 « Habiter les littoraux », sous-thème « Littoral
# industrialo-portuaire » (programme en vigueur en 6e jusqu'en 2026-2027 inclus).
# Démarche (fiche Eduscol du thème 3) : étude de cas d'un grand complexe industrialo-portuaire (Rotterdam,
# cité par la fiche et très utilisé par les manuels), mise en perspective avec un port français (Le Havre,
# cité aussi), puis généralisation. Les habitants (travailler, se loger, se divertir) et les conflits
# d'usage sont au centre, comme le demande la fiche.
# Leçon précédente : « Habiter un espace agricole » (thème 2).
# Leçon suivante : « Un littoral touristique » (contenu/6e/geographie/littoral-touristique).
titre: Un littoral industrialo-portuaire
public: 6e
matiere: geographie
matiereLibelle: Géographie
ordre: 5
langue: fr
statut: brouillon
resume: >-
  Rotterdam, le plus grand port d'Europe, puis Le Havre : conteneurs, terminaux, zones
  industrialo-portuaires, habitants, conflits d'usage et protection de la nature.
sources:
  - libelle: >-
      Programme du cycle 3 en vigueur (Eduscol, d'après le BOEN n° 31 du 30 juillet 2020) — classe de
