# Leçon en brouillon : toutes les images sont à générer (description de ce qu'elles montrent).
# Programme : cycle 3, classe de 6e, géographie, thème 2 « Habiter un espace de faible densité »,
# sous-thème « Habiter un espace de faible densité à vocation agricole » (programme en vigueur en 6e
# jusqu'en 2026-2027 inclus).
# La fiche Eduscol conseille de comparer deux études de cas : une campagne intensive reliée au monde
# (grandes plaines d'Amérique du Nord) et un espace rural fragile d'un pays du Sud (sud du Mali). La leçon
# suit ce plan : l'Iowa, au cœur de la Corn Belt, puis le sud du Mali, puis les notions, avec des exemples
# français.
# Leçon précédente : « Habiter un espace à fortes contraintes » (contenu/6e/geographie/fortes-contraintes).
# Leçon suivante : « Un littoral industrialo-portuaire » (contenu/6e/geographie/littoral-portuaire).
titre: Habiter un espace agricole
public: 6e
matiere: geographie
matiereLibelle: Géographie
ordre: 4
langue: fr
statut: brouillon
resume: >-
  Une campagne de grandes machines aux États-Unis, une agriculture familiale au Mali, et la vie à la
  campagne : paysages, exploitations, déplacements.
