      - picto: densite
        motCle: densité
        phrases:
          - Dans le delta du Mékong, la densité dépasse 400 habitants par km² en 2022.
        enSavoirPlus: >-
          C'est plus de trois fois la densité de la France. Au Nunavut, au contraire, il y a bien moins
          d'un habitant par km².
        image:
          aGenerer: >-
            Infographie simple, format 4:3 paysage, fond blanc, sans aucun texte. Deux grands carrés
            verts de même taille côte à côte, vus de dessus, bien séparés. Le carré de gauche est rempli
            de nombreuses petites silhouettes de personnes noires (une centaine), serrées. Le carré de
            droite ne contient que deux petites silhouettes de personnes noires. Style plat et net,
            couleurs franches. Ne doit pas figurer : texte, lettre, chiffre, légende, flèche, signe.
          alt: >-
            Deux carrés de même taille : celui de gauche contient beaucoup de personnes (forte densité),
            celui de droite seulement deux (faible densité).
      - picto: maison
        motCle: groupé ou dispersé
        phrases:
          - "L'habitat est groupé quand les maisons se serrent en village, dispersé quand elles sont isolées."
        enSavoirPlus: >-
          Dans l'Iowa, que tu as étudié, les fermes sont loin les unes des autres : l'habitat est
          dispersé.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, vue aérienne, format 4:3 paysage, en deux moitiés
            côte à côte séparées par une fine bande blanche. À gauche : un village de campagne aux
            maisons serrées les unes contre les autres autour d'une place, entouré de champs. À droite :
            une campagne verte où cinq fermes sont posées loin les unes des autres, chacune au milieu de
            ses champs. Ne doit pas figurer : texte, lettre, chiffre, logo, panneau.
          alt: >-
            À gauche, un village aux maisons serrées (habitat groupé) ; à droite, des fermes isolées loin
            les unes des autres (habitat dispersé).
      - picto: montagne
        motCle: milieu
        phrases:
          - "Le milieu compte : l'eau et les plaines attirent ; le grand froid, la sécheresse et la haute montagne gênent."
        enSavoirPlus: >-
          Le milieu n'explique pas tout : certaines plaines bien arrosées sont peu peuplées.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage, en deux moitiés côte à côte séparées
            par une fine bande blanche. À gauche : une plaine verte au bord d'un fleuve, avec des champs
            et des villages. À droite : une haute montagne enneigée et rocheuse, sans aucune maison. Ne
            doit pas figurer : texte, lettre, chiffre, logo, panneau, personne.
          alt: À gauche, une plaine verte et habitée au bord d'un fleuve ; à droite, une haute montagne enneigée sans maison.
      - picto: sablier
        motCle: histoire
        phrases:
          - "L'histoire compte aussi : l'Asie et l'Europe sont très peuplées depuis le Néolithique."
        enSavoirPlus: >-
          Avec l'agriculture, les humains se sont installés et sont devenus nombreux aux mêmes endroits.
          Ces grands foyers de peuplement existent toujours.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. En Asie de l'Est, des rizières en
            terrasses très anciennes, vertes, sculptées dans une colline, avec un village de maisons
            traditionnelles au pied ; un paysage travaillé par les humains depuis des siècles. Ne doit
            pas figurer : texte, lettre, chiffre, logo, panneau, touriste, véhicule.
          alt: Des rizières en terrasses très anciennes sur une colline, avec un village au pied.
      - picto: truelle
        motCle: aménager
        phrases:
          - "Les sociétés transforment leur espace : canaux, irrigation, routes rendent habitables des lieux difficiles."
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, vue aérienne, format 4:3 paysage. Dans un désert de
            sable ocre, de grands cercles verts parfaitement ronds de cultures irriguées, alignés, avec
            au centre de chacun le pivot d'arrosage ; une route droite les longe. Ne doit pas figurer :
            texte, lettre, chiffre, logo, panneau.
          alt: Des cercles verts de cultures irriguées au milieu d'un désert de sable.
      - picto: digue
        motCle: développement
        phrases:
          - Un pays riche peut construire plus de routes, de digues et de réseaux d'eau qu'un pays pauvre.
        enSavoirPlus: >-
          Les habitants d'un même pays n'ont pas tous les mêmes moyens : il y a aussi des inégalités
          entre eux.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Un chantier de digue au bord d'une
            large rivière : une pelleteuse dépose des blocs de pierre, deux ouvriers en casque et gilet
            de sécurité vérifient le travail ; une ville au loin. Ne doit pas figurer : texte, lettre,
            chiffre, logo, inscription sur les gilets, panneau, nom de marque sur l'engin.
          alt: Des ouvriers et une pelleteuse construisent une digue de pierres au bord d'une rivière.
      - picto: lieu
        motCle: habiter
        phrases:
          - Habiter, c'est se loger, travailler, se déplacer et se divertir dans un lieu.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Une rue animée d'un quartier
            d'habitation d'une ville moyenne, en fin d'après-midi : des immeubles et des maisons avec
            leurs fenêtres, une boulangerie et un petit atelier ouverts, un bus et des cyclistes qui
            passent, des enfants qui jouent au ballon sur une petite place avec des arbres. Ne doit pas
            figurer : texte, lettre, chiffre, enseigne lisible, logo, publicité, plaque de rue.
          alt: Une rue où l'on voit des logements, des commerces, un bus, des cyclistes et des enfants qui jouent.
      - picto: globe
        motCle: tour du monde
        phrases:
          - "Métropole, campagne, désert, Grand Nord ou littoral : chaque société habite la Terre à sa façon."
        enSavoirPlus: >-
          Cette année, tu as étudié des métropoles (Mumbai, Paris), des espaces peu peuplés (Nunavut,
          Iowa, Mali), des littoraux (Rotterdam, Cancún), et maintenant le monde entier.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Un montage de quatre photos égales
            en grille de deux sur deux, séparées par de fines bandes blanches : en haut à gauche, les
            immeubles d'une grande ville ; en haut à droite, une rizière verte avec un village ; en bas à
            gauche, une oasis de palmiers dans le désert ; en bas à droite, une plage bordée
            d'immeubles. Ne doit pas figurer : texte, lettre, chiffre, logo, enseigne, panneau.
          alt: Quatre photos, une grande ville, une rizière avec un village, une oasis dans le désert et une plage bordée d'immeubles.
    questions:
      - question: "Où la densité est-elle la plus forte : dans le delta du Mékong ou au Nunavut ?"
        reponse: Dans le delta du Mékong, avec plus de 400 habitants par km².
      - question: Cite deux raisons qui expliquent qu'un espace est très peuplé.
        reponse: "Un milieu favorable (eau, plaine) et une longue histoire : il est habité depuis le Néolithique."
      - question: Que veut dire habiter ?
        reponse: Se loger, travailler, se déplacer et se divertir dans un lieu.
      - question: Un désert est-il complètement vide ?
        reponse: Non, des humains vivent dans les oasis ou s'y déplacent avec leurs troupeaux.
