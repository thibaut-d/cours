# Leçon en brouillon : toutes les images sont à générer (description de ce qu'elles montrent).
# Programme : cycle 3, classe de 6e, géographie, thème 4 « Le monde habité », sous-thème « La variété des
# formes d'occupation spatiale dans le monde » (programme en vigueur en 6e jusqu'en 2026-2027 inclus).
# Dernière leçon de géographie de 6e : elle fait aussi la synthèse de l'année (métropoles, espaces de
# faible densité, littoraux), comme le demande la fiche Eduscol (« approche filée », « tour du monde de la
# planète habitée »).
# Étude de cas : le delta du Mékong (Vietnam), espace rural très densément peuplé, puis d'autres formes
# d'occupation dans le monde, puis les notions.
# Leçon précédente : « Où vivent les humains ? » (contenu/6e/geographie/population-mondiale).
# Leçon suivante : aucune (fin du programme de géographie de 6e).
titre: Des façons d'habiter la Terre
public: 6e
matiere: geographie
matiereLibelle: Géographie
ordre: 8
langue: fr
statut: brouillon
resume: >-
  Le delta du Mékong, une campagne très peuplée, puis mégapoles, fronts pionniers, nomades, littoraux
  et la mer : toute la Terre est habitée, de façons très variées.
sources:
