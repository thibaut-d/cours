chapitres:
  # ---------------------------------------------------------------------------------------------
  - titre: Le delta du Mékong
    ensemble:
      type: mosaique
    formule: delta + riz + canaux = campagne très peuplée
    cartes:
      - picto: lieu
        motCle: delta du Mékong
        phrases:
          - "Au sud du Vietnam, le Mékong se divise en plusieurs bras avant la mer : c'est un delta."
        image:
          aGenerer: >-
            Carte de géographie en relief, vue d'en haut, comme une image satellite aux couleurs
            naturelles, format 4:3 paysage, sans aucun texte. Elle montre le sud du Cambodge et le sud du
            Vietnam. La mer est en bleu en bas de l'image et à gauche (golfe de Thaïlande, en bas à
            gauche) et en bas à droite (mer de Chine méridionale, centrée vers 82 % de la largeur et
            84 % de la hauteur). La terre est verte. Le grand fleuve Mékong, ruban bleu bien visible,
            entre par le haut de l'image vers 38 % de la largeur, descend vers le sud-est, passe vers
            45 % de la largeur et 42 % de la hauteur, puis se divise en six ou sept bras parallèles qui
            rejoignent la mer en bas à droite, entre 55 % et 75 % de la largeur. Entre ces bras, une
            grande plaine plate d'un vert vif de rizières, quadrillée de fins canaux droits, couvre le
            bas de l'image, centrée vers 50 % de la largeur et 78 % de la hauteur. Côte basse, sans
            falaise. Des reliefs vert sombre en haut à droite. Une tache grise urbaine bien visible
            marque Hô Chi Minh-Ville, vers 67 % de la largeur et 48 % de la hauteur. Couleurs douces et
            contrastées, côtes nettes. Ne doit pas figurer : texte, lettre, chiffre, nom de lieu,
            frontière, route, quadrillage de coordonnées, légende, rose des vents, flèche.
          alt: >-
            Carte du sud du Vietnam : le Mékong descend du Cambodge et se divise en plusieurs bras avant
            la mer de Chine méridionale ; entre les bras, une grande plaine verte de rizières, le delta.
          etiquettes:
            - texte: Cambodge
              x: 22
              y: 18
            - texte: Vietnam
              x: 84
              y: 24
            - texte: Mékong
              x: 45
              y: 42
            - texte: Hô Chi Minh-Ville
              x: 67
              y: 48
            - texte: delta du Mékong
              x: 50
              y: 78
            - texte: mer de Chine
              x: 82
              y: 84
      - picto: groupe
        motCle: campagne peuplée
        phrases:
          - Plus de 17 millions de personnes vivent dans le delta en 2022, surtout à la campagne.
        enSavoirPlus: >-
          Le delta est une campagne bien plus peuplée que les campagnes françaises.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, vue aérienne prise par un drone, format 4:3 paysage. La
            campagne du delta du Mékong au Vietnam : un canal brun traverse l'image en diagonale ; sur
            ses deux rives, une file presque continue de maisons basses aux toits de tôle et de tuiles,
            entourées de cocotiers et de bananiers ; derrière les maisons, de grandes rizières vertes
            rectangulaires jusqu'à l'horizon. Quelques petits bateaux sur le canal. Lumière du matin. Ne
            doit pas figurer : texte, lettre, chiffre, panneau, enseigne, logo, publicité, grand
            immeuble.
          alt: >-
            Vue d'avion d'un canal bordé de maisons serrées les unes contre les autres, avec des rizières
            derrière.
      - picto: epi
        motCle: rizière
        phrases:
          - "Grâce à l'eau et à la terre fertile du fleuve, les familles cultivent surtout le riz."
        enSavoirPlus: >-
          Au centre du delta, on peut faire deux récoltes de riz par an.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Dans le delta du Mékong au
            Vietnam, une femme et un homme, en vêtements de travail à manches longues et chapeaux
            coniques, repiquent de jeunes plants de riz dans une rizière inondée, de l'eau jusqu'aux
            chevilles. Rizières vert tendre jusqu'au loin, une rangée de cocotiers au fond. Personnes
            montrées avec respect, au travail, sans pose. Ne doit pas figurer : texte, lettre, chiffre,
            logo, inscription sur les vêtements, panneau, machine moderne au premier plan.
          alt: Une femme et un homme repiquent des plants de riz dans une rizière inondée.
      - picto: maison
        motCle: se loger
        phrases:
          - "Les maisons s'alignent le long des canaux : l'eau devant, la rizière derrière."
        enSavoirPlus: >-
          Certaines maisons sont construites sur pilotis, au-dessus de l'eau, pour laisser la terre aux
          cultures et se protéger des crues.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage, prise depuis un bateau sur un canal
            du delta du Mékong. Sur la rive, une rangée de maisons simples et propres, en bois et en
            brique, certaines sur pilotis au-dessus de l'eau, avec de petits pontons ; des plantes en
            pots, du linge qui sèche ; un enfant fait signe de la main depuis un ponton. Cocotiers
            derrière. Ne doit pas figurer : texte, lettre, chiffre, panneau, enseigne, logo, publicité,
            antenne satellite au premier plan, déchets.
          alt: Des maisons en bois et en brique, certaines sur pilotis, au bord d'un canal.
      - picto: pirogue
        motCle: se déplacer
        phrases:
          - "On circule en bateau sur les canaux, et à moto sur les petites routes le long de l'eau."
        enSavoirPlus: >-
          De grands ponts ont été construits, mais il en manque encore : on traverse souvent les bras du
          fleuve en bac, un bateau qui fait la navette d'une rive à l'autre.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Sur un large bras du Mékong au
            Vietnam, un petit bac en bois transporte d'une rive à l'autre une dizaine de personnes et
            leurs motos ; à côté, une longue barque à moteur chargée de sacs de riz. Eau brune, ciel
            clair, rive plate avec des cocotiers. Ne doit pas figurer : texte, lettre, chiffre, plaque
            d'immatriculation lisible, logo, enseigne, nom peint sur le bateau, drapeau.
          alt: Un petit bac transporte des personnes et leurs motos sur un bras du Mékong, à côté d'une barque chargée de sacs.
      - picto: sac
        motCle: marché flottant
        phrases:
          - À Can Tho, des centaines de bateaux vendent chaque matin les fruits et légumes du delta.
        enSavoirPlus: >-
          C'est le marché flottant de Cai Rang. Les bateaux accrochent en haut d'une perche un exemple de
          ce qu'ils vendent.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage, tôt le matin. Le marché flottant
            de Cai Rang, près de Can Tho, sur un bras du Mékong au Vietnam : de nombreux bateaux en bois
            serrés les uns contre les autres, chargés de pastèques, d'ananas, de choux et de patates
            douces ; sur certains, un fruit est accroché en haut d'une longue perche ; des vendeurs et
            des acheteurs se passent des fruits de bateau à bateau. Lumière dorée. Ne doit pas figurer :
            texte, lettre, chiffre, panneau, enseigne, logo, étiquette de prix, nom peint sur les
            bateaux.
          alt: Un marché sur l'eau, avec de nombreux bateaux chargés de fruits et de légumes.
      - picto: goutte
        motCle: canaux
        phrases:
          - Les habitants ont creusé des milliers de kilomètres de canaux pour irriguer et circuler.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, vue aérienne verticale prise par un drone, format 4:3
            paysage. Dans le delta du Mékong au Vietnam, des canaux rectilignes se croisent à angle droit
            et découpent de grandes rizières vertes et jaunes en rectangles ; le long des canaux, des
            lignes de maisons et d'arbres. Ne doit pas figurer : texte, lettre, chiffre, panneau, logo,
            grande ville, usine.
          alt: Vue du ciel de canaux droits qui se croisent et découpent les rizières en rectangles.
      - picto: vague
        motCle: crue
        phrases:
          - "Chaque année, la crue du fleuve apporte eau et limon, mais elle peut inonder les maisons."
        enSavoirPlus: >-
          Le limon est une boue fine qui rend la terre fertile. Près de la mer, l'eau salée qui remonte
          les bras du fleuve gêne aussi la culture du riz.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Dans le delta du Mékong au
            Vietnam, à la saison des hautes eaux : des champs couverts d'une eau brune calme jusqu'à
            l'horizon, des cocotiers et des maisons sur pilotis qui dépassent de l'eau ; une barque avec
            deux personnes circule entre les maisons. Calme, sans détresse ni catastrophe. Ne doit pas
            figurer : texte, lettre, chiffre, panneau, logo, enseigne, objet flottant en plastique,
            secouriste.
          alt: Des champs couverts par la crue, avec des maisons sur pilotis et une barque.
    questions:
      - question: Pourquoi le delta du Mékong est-il très peuplé ?
        reponse: "Grâce à l'eau et à la terre fertile : on peut y cultiver beaucoup de riz."
      - question: Comment se déplacent les habitants du delta ?
        reponse: En bateau sur les canaux, à moto sur les petites routes, en bac pour traverser le fleuve.
      - question: Quel aménagement les habitants ont-ils construit ?
        reponse: Des canaux, pour irriguer les rizières et circuler en bateau.

  # ---------------------------------------------------------------------------------------------
  - titre: Ailleurs, d'autres façons d'habiter
    ensemble:
      type: mosaique
    formule: chaque espace = une façon d'habiter
    cartes:
      - picto: tour
        motCle: mégapole
        phrases:
          - Une mégapole est une ville de plus de 10 millions d'habitants.
        enSavoirPlus: >-
          En 2018, selon l'ONU, il y en avait 33, surtout en Asie ; la plus grande était Tokyo. Mumbai,
          étudiée cette année, en est une. En 2025, l'ONU compte les villes d'une nouvelle façon, plus
          large : Jakarta, en Indonésie, passe alors devant Dhaka et Tokyo.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, vue aérienne en fin de journée, format 4:3 paysage.
            Une immense ville d'Asie qui s'étend jusqu'à l'horizon : des tours de bureaux au centre, des
            milliers d'immeubles d'habitation autour, de larges avenues et des voies rapides chargées de
            voitures. Ne doit pas figurer : texte, lettre, chiffre, enseigne lisible, logo, publicité,
            monument célèbre reconnaissable.
          alt: Une immense ville d'Asie vue d'avion, avec des tours et des milliers d'immeubles jusqu'à l'horizon.
      - picto: train
        motCle: mégalopole
        phrases:
          - "Une mégalopole est une suite de grandes villes reliées entre elles, comme Tokyo, Nagoya et Osaka."
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Au Japon, un train à grande vitesse
            blanc au long nez file sur un viaduc à travers une zone urbaine continue : maisons, immeubles
            et petites usines se suivent sans interruption jusqu'aux collines au loin. Ne doit pas
            figurer : texte, lettre, chiffre, logo, enseigne, publicité, inscription sur le train.
          alt: Un train à grande vitesse traverse au Japon une zone où les villes se suivent sans interruption.
      - picto: arbre
        motCle: front pionnier
        phrases:
          - "En Amazonie, des agriculteurs défrichent la forêt le long des routes : c'est un front pionnier."
        enSavoirPlus: >-
          Défricher, c'est couper la forêt pour cultiver ou élever du bétail. Cela détruit une partie de
          la forêt.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, vue aérienne, format 4:3 paysage. En Amazonie
            brésilienne : à gauche, la forêt tropicale dense et intacte ; à droite, des prés défrichés
            avec quelques vaches blanches et de petites fermes ; entre les deux, une route de terre
            rouge bien droite qui avance dans la forêt. Ne doit pas figurer : texte, lettre, chiffre,
            logo, panneau, incendie, fumée.
          alt: Une route de terre rouge entre la forêt amazonienne, à gauche, et des prés défrichés, à droite.
      - picto: tente
        motCle: nomade
        phrases:
          - En Mongolie, des éleveurs nomades déplacent leurs troupeaux et leur yourte selon les saisons.
        enSavoirPlus: >-
          La yourte est une grande tente ronde de feutre qu'on démonte et remonte en quelques heures.
          C'est un habitat temporaire : il ne reste pas toujours au même endroit.
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. Dans la steppe de Mongolie en été,
            immense prairie verte et collines douces : deux yourtes blanches rondes ; une famille
            d'éleveurs en vêtements traditionnels et modernes mêlés surveille un troupeau de moutons et
            de chèvres ; un cavalier au loin. Ne doit pas figurer : texte, lettre, chiffre, logo,
            panneau, drapeau, inscription sur les vêtements.
          alt: Deux yourtes blanches dans la steppe de Mongolie, avec une famille et un troupeau de moutons.
      - picto: vague
        motCle: littoral
        phrases:
          - "Les littoraux attirent de plus en plus d'habitants : ports, usines, plages et stations touristiques."
        enSavoirPlus: >-
          Un littoral est l'espace où la terre touche la mer. Tu as étudié des ports (Rotterdam, Le
          Havre) et des stations touristiques (La Grande-Motte, Cancún).
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, vue aérienne, format 4:3 paysage. Un littoral très
            aménagé au bord d'une mer bleue : à gauche, un port avec des grues, des conteneurs et un
            grand navire à quai ; à droite, une longue plage bordée d'immeubles et d'hôtels, avec des
            baigneurs. Ne doit pas figurer : texte, lettre, chiffre, logo, enseigne, nom de navire
            lisible, publicité.
          alt: Un littoral aménagé, avec un port de commerce à gauche et une plage bordée d'immeubles à droite.
      - picto: bateau
        motCle: en mer
        phrases:
          - "Même la mer est habitée : des marins vivent plusieurs semaines à bord des navires."
        image:
          aGenerer: >-
            Photographie réaliste d'aujourd'hui, format 4:3 paysage. En pleine mer, sans terre visible,
            un grand porte-conteneurs chargé de conteneurs de couleurs vives navigue sur une mer calme ;
            à l'arrière, sur le pont, deux marins en combinaison de travail regardent l'horizon. Ne doit
            pas figurer : texte, lettre, chiffre, logo, nom de navire ou de compagnie lisible, drapeau.
          alt: Un grand navire chargé de conteneurs en pleine mer, avec deux marins sur le pont.
    questions:
      - question: Qu'est-ce qu'un front pionnier ?
        reponse: Un espace où l'on défriche pour cultiver et habiter des terres nouvelles, comme en Amazonie.
      - question: Comment vivent les éleveurs nomades de Mongolie ?
        reponse: Ils déplacent leurs troupeaux et leur yourte selon les saisons.
      - question: Quelle est la différence entre une mégapole et une mégalopole ?
        reponse: "La mégapole est une ville géante ; la mégalopole est une suite de grandes villes reliées."

  # ---------------------------------------------------------------------------------------------
  - titre: Toute la Terre est habitée
    ensemble:
      type: mosaique
    formule: habiter = se loger + travailler + se déplacer + se divertir
    cartes:
      - picto: globe
        motCle: monde habité
        phrases:
          - Les lieux étudiés cette année sont dans des espaces très peuplés ou peu peuplés.
        enSavoirPlus: >-
          Aucun espace n'est tout à fait vide : les humains habitent presque toute la Terre.
        image:
          aGenerer: >-
            Planisphère simple, vue d'en haut, format 4:3 paysage, sans aucun texte. Projection
            rectangulaire simple : de 180° ouest (bord gauche) à 180° est (bord droit), et de 80° nord
            (bord du haut) à 60° sud (bord du bas), Antarctique coupée. Océans en bleu clair uni.
            Continents coloriés en trois couleurs : rouge orangé pour les espaces très peuplés (Asie de
            l'Est, Inde et Bangladesh, Europe, île de Java, vallée du Nil, côte du golfe de Guinée,
            nord-est des États-Unis) ; jaune pâle pour les espaces moyennement ou peu peuplés ; gris
