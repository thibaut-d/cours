    url: https://eduscol.education.fr/document/50990/download
  - libelle: >-
      Eduscol, « S'approprier les différents thèmes du programme — Géographie 6e, thème 2 : Habiter un
      espace de faible densité » (mars 2016) : contrainte (grand froid, sécheresse, chaleur humide,
      pente, altitude), adaptation, biodiversité, parcs, exemples (Grand Nord canadien, forêts denses),
      écueils (déterminisme ; peu d'habitants ne veut pas dire biodiversité préservée)
