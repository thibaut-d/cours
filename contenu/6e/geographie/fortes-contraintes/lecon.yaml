# Leçon en brouillon : toutes les images sont à générer (description de ce qu'elles montrent).
# Programme : cycle 3, classe de 6e, géographie, thème 2 « Habiter un espace de faible densité »,
# sous-thème « Habiter un espace à forte(s) contrainte(s) naturelle(s) ou/et de grande biodiversité »
# (programme en vigueur en 6e jusqu'en 2026-2027 inclus).
# Étude de cas : le Nunavut (Grand Nord canadien), proposé en premier par la fiche Eduscol ; puis deux
# exemples plus courts, la Guyane (forêt amazonienne, en France) et le Sahara ; puis la généralisation.
# Leçon précédente : « La ville de demain » (thème 1).
# Leçon suivante : « Habiter un espace agricole » (contenu/6e/geographie/espace-agricole).
titre: Habiter un espace à fortes contraintes
public: 6e
matiere: geographie
matiereLibelle: Géographie
ordre: 3
langue: fr
statut: brouillon
resume: >-
  Vivre au Nunavut, dans le froid du Grand Nord canadien, puis dans la forêt de Guyane et au Sahara :
  contraintes naturelles, adaptations, ressources et espaces protégés.
sources:
  - libelle: >-
