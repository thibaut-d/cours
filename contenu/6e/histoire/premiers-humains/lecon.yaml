    url: https://eduscol.education.gouv.fr/4791/ressources-d-accompagnement-du-programme-d-histoire-et-geographie-au-cycle-3
  - libelle: Smithsonian, Human Origins — Homo sapiens (apparu en Afrique il y a environ 300 000 ans)
