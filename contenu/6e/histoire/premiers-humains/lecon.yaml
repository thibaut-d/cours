  - libelle: Collège de France, les plus anciens Homo sapiens découverts au Maroc (Jebel Irhoud)
    url: https://www.college-de-france.fr/fr/actualites/les-prs-jean-jacques-hublin-et-abdelouahed-ben-ncer-decouvrent-les-plus-anciens-homo-sapiens-au
