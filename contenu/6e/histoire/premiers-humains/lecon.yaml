# Leçon en brouillon : toutes les images sont à générer (description de ce qu'elles montrent).
# Programme : cycle 3, classe de 6e, thème 1 « La longue histoire de l'humanité et des migrations »,
# sous-thème « Les débuts de l'humanité » (programme en vigueur en 6e jusqu'en 2026-2027 inclus).
# Suite : leçon « Vivre au Paléolithique » (contenu/6e/histoire/paleolithique).
titre: Les premiers humains
public: 6e
matiere: histoire
matiereLibelle: Histoire
ordre: 1
langue: fr
statut: brouillon
resume: >-
  Les débuts de l'humanité : un temps très long, des premiers humains en Afrique au peuplement de toute
  la Terre.
