      - picto: pas
        motCle: Zhang Qian
        phrases:
          - "Vers 139 av. J.-C., l'empereur Wudi envoie Zhang Qian vers l'ouest : il découvre les peuples d'Asie centrale."
        enSavoirPlus: >-
          Il cherche des alliés contre les Xiongnu et ne revient qu'après treize ans de voyage. On le
          considère comme le fondateur de la route de la soie.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. Vers 130 av. J.-C., dans les montagnes d'Asie
            centrale : Zhang Qian, envoyé chinois de l'empereur, barbu, en robe de voyage chinoise sombre et
            bonnet noir, avance à cheval en tenant un long bâton de bambou orné de touffes de crin rouge, le
            signe de sa mission ; derrière lui, quelques compagnons et des chevaux de bât. Vallée herbeuse,
            sommets enneigés. Ne doit pas figurer : texte, lettre, caractère chinois, chiffre, drapeau
            moderne, étrier (inconnu à cette époque), arme à feu, objet moderne.
          alt: Un envoyé chinois à cheval, tenant un long bâton orné de crin rouge, traverse une vallée de montagne.
      - picto: chameau
        motCle: caravane
        phrases:
          - "Les marchands voyagent en caravanes : de longues files de chameaux chargés de marchandises."
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. Vers l'an 100, dans un désert de dunes d'Asie
            centrale : une longue file de chameaux à deux bosses, chargés de gros ballots de tissu enveloppés
            de toile et de sacs, avance sur une piste ; des marchands d'Asie centrale, en tunique et bonnet
            de feutre, marchent à côté. Lumière dorée de fin d'après-midi, montagnes au loin. Ne doit pas
            figurer : texte, lettre, chiffre, dromadaire à une bosse, route goudronnée, véhicule, vêtement
            moderne, objet en plastique.
          alt: Une longue file de chameaux à deux bosses, chargés de ballots, traverse un désert de dunes.
      - picto: goutte
        motCle: oasis
        phrases:
          - "Dans le désert, les caravanes s'arrêtent dans les oasis : des villes vertes autour d'un point d'eau."
        enSavoirPlus: >-
          Par exemple Dunhuang, à l'entrée de la Chine, où les Han installent un poste militaire vers
          117 av. J.-C.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage, légère plongée. Vers l'an 100, une oasis au bord
            d'un grand désert d'Asie : des peupliers et des champs verts irrigués par de petits canaux, des
            maisons en terre beige aux toits plats, une grande cour où se reposent des chameaux à deux
            bosses ; tout autour, des dunes de sable et des montagnes nues. Ne doit pas figurer : texte,
            lettre, chiffre, mosquée, minaret, coupole, route goudronnée, véhicule, poteau électrique.
          alt: Une oasis verte avec des arbres, des champs et des maisons de terre, au milieu du désert.
      - picto: main
        motCle: intermédiaires
        phrases:
          - "Personne ne fait tout le voyage : chaque marchand, un intermédiaire, revend la soie au suivant."
        enSavoirPlus: >-
          Entre la Chine et les Parthes, la soie traverse l'empire des Kouchans, dans l'Afghanistan et le
          Pakistan d'aujourd'hui. Chaque intermédiaire prend sa part.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. Vers l'an 100, sur un marché d'une ville d'Asie
            centrale : un marchand chinois en robe sombre tend un rouleau de soie rouge brillante à un
            marchand d'Asie centrale en tunique et bonnet de feutre, qui le touche pour vérifier sa qualité ;
            entre eux, une petite balance en bronze et des ballots ; chameaux à l'arrière-plan. Ne doit pas
            figurer : texte, lettre, caractère chinois, chiffre, billet, pièce avec inscription lisible,
            objet en plastique, vêtement moderne.
          alt: Sur un marché, un marchand chinois tend un rouleau de soie rouge à un marchand d'Asie centrale.
      - picto: bouclier
        motCle: Parthes
        phrases:
          - "Les Parthes, ennemis de Rome, tiennent le passage en Perse et gardent pour eux le commerce de la soie."
        enSavoirPlus: >-
          Leur empire s'étend sur l'Iran et l'Irak d'aujourd'hui. Selon un livre chinois, ils empêchent les
          Romains d'aller jusqu'en Chine.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. Vers l'an 100, sur un plateau sec d'Iran : deux
            cavaliers parthes, barbus, cheveux longs retenus par un bandeau, en tunique et larges pantalons
            brodés, montent des chevaux bais ; l'un tire à l'arc vers l'arrière en se retournant sur sa
            selle ; au loin, une caravane de chameaux passe sous leur surveillance. Ne doit pas figurer :
            texte, lettre, chiffre, étrier, armure de chevalier, épée moderne, arme à feu, drapeau.
          alt: Deux cavaliers parthes avec des arcs surveillent une caravane qui passe au loin.
      - picto: bateau
        motCle: route de la mer
        phrases:
          - "Des navires partent aussi d'Égypte romaine vers l'Inde, poussés par de grands vents réguliers, la mousson."
        enSavoirPlus: >-
          Ils partent des ports de la mer Rouge. En Inde, les marchands romains achètent du poivre, des
          pierres précieuses et de la soie venue de Chine.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. Vers l'an 100, en pleine mer : un gros navire
            de commerce romain en bois, à la coque ronde, avec une grande voile carrée beige gonflée par le
            vent, avance sur une mer bleu sombre aux vagues moyennes ; des amphores et des marins en tunique
            courte sur le pont. Ciel lumineux avec quelques nuages. Ne doit pas figurer : texte, lettre,
            chiffre, moteur, cheminée, hélice, drapeau, voile triangulaire moderne, bouée en plastique.
          alt: Un navire de commerce romain à voile carrée navigue en pleine mer.
      - picto: sac
        motCle: luxe
        phrases:
          - "À Rome, la soie coûte très cher : seuls les riches peuvent s'habiller avec ce tissu."
        enSavoirPlus: >-
          Elle vient de très loin et passe par beaucoup d'intermédiaires. Le Sénat de Rome essaie même de
          limiter son usage.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. Vers l'an 100, dans une riche maison romaine aux
            murs peints de rouge et d'ocre : une dame romaine, coiffure bouclée relevée, essaie un voile de
            soie fine et transparente couleur safran, qui brille à la lumière ; une autre femme tient le
            tissu et l'admire. Mosaïque au sol, jardin à colonnes au fond. Ne doit pas figurer : texte,
            lettre, chiffre, miroir moderne, bijou moderne, vêtement moderne, objet en plastique.
          alt: Dans une riche maison romaine, une dame essaie un voile de soie transparent et brillant.
    questions:
      - question: Pourquoi parle-t-on de « route de la soie » ?
        reponse: Parce que la soie de Chine est la marchandise la plus célèbre qui voyage sur ces routes.
      - question: Comment les marchandises voyagent-elles entre la Chine et Rome ?
        reponse: Sur des pistes, en caravanes de chameaux, et par la mer, en bateau.
      - question: Pourquoi la soie coûte-t-elle si cher à Rome ?
        reponse: Elle vient de très loin, et chaque intermédiaire prend sa part.

  # ---------------------------------------------------------------------------------------------
  - titre: Deux mondes qui se connaissent mal
    ensemble:
      type: frise
      periodes:
        - libelle: le bouddhisme arrive en Chine
          dates: Ier siècle apr. J.-C.
          carte: 8
        - libelle: voyage de Gan Ying
          dates: en 97
          carte: 3
        - libelle: envoyés romains en Chine
          dates: en 166
          carte: 4
    formule: échanges = des marchandises + des idées
    cartes:
      - picto: groupe
        motCle: Sères
        phrases:
          - "Les Romains appellent les Chinois les « Sères », le peuple de la soie, sans bien les connaître."
        enSavoirPlus: >-
          Pline l'Ancien, un savant romain du Ier siècle, croit qu'ils récoltent la soie sur les arbres de
          leurs forêts.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. Vers l'an 70, dans une bibliothèque romaine
            aux étagères pleines de rouleaux : un savant romain âgé, en toge blanche, assis à une table,
            regarde avec curiosité un morceau de soie bleue brillante qu'il tient entre ses doigts ; un
            rouleau de papyrus déroulé devant lui, couvert de lignes fines vues de loin, illisibles. Lumière
            d'une lampe à huile. Ne doit pas figurer : lettre lisible, chiffre, livre relié, lunettes,
            plume d'oiseau, objet moderne.
          alt: Un savant romain en toge observe avec curiosité un morceau de soie bleue, devant des rouleaux.
      - picto: groupe
        motCle: Da Qin
        phrases:
          - "Les Chinois appellent l'empire romain « Da Qin » : ils en entendent parler par des marchands."
        enSavoirPlus: >-
          Un livre d'histoire chinois le décrit comme un grand pays riche, aux villes entourées de murs de
          pierre.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. Vers l'an 100, dans une salle de bois d'un
            bâtiment officiel de la Chine des Han : un fonctionnaire chinois en robe sombre, assis à genoux,
            écoute un marchand d'Asie centrale en tunique et bonnet de feutre, qui fait un geste lointain de
            la main comme pour raconter un pays très éloigné ; un scribe chinois prend des notes au pinceau
            sur des lamelles de bambou ; les signes tracés sont minuscules, vus de loin, flous et
            illisibles. Ne doit pas figurer : lettre de notre alphabet, chiffre arabe, caractère chinois net
            ou lisible, carte dessinée, objet moderne.
          alt: Un fonctionnaire chinois écoute un marchand venu de loin raconter ce qu'il sait d'un pays lointain.
      - picto: pas
        motCle: Gan Ying
        phrases:
          - "En 97, l'envoyé chinois Gan Ying atteint une mer à l'ouest, mais renonce à aller jusqu'à Rome."
        enSavoirPlus: >-
          Selon un livre chinois, des marins parthes lui disent que la traversée peut durer deux ans. Il fait
          demi-tour.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. En 97, sur un rivage sec du Proche-Orient : un
            envoyé chinois des Han, en robe de voyage sombre et bonnet noir, regarde la mer immense ; à côté
            de lui, un marin parthe barbu, en tunique, montre l'horizon de la main ; une barque en bois est
            tirée sur le sable. Ciel lumineux. Ne doit pas figurer : texte, lettre, caractère chinois,
            chiffre, bateau à moteur, phare, bâtiment moderne, objet moderne.
          alt: Un envoyé chinois regarde la mer, pendant qu'un marin lui montre l'horizon.
      - picto: drapeau
        motCle: envoyés de Rome
        phrases:
          - "En 166, selon un livre chinois, des envoyés de l'empereur romain arrivent par la mer à la cour des Han."
        enSavoirPlus: >-
          Ils offrent de l'ivoire et des carapaces de tortue. Aucun texte romain n'en parle : c'étaient
          peut-être des marchands.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. En 166, dans une grande salle de palais de la
            Chine des Han aux colonnes de bois laqué rouge et noir : trois voyageurs venus de l'empire romain,
            en tuniques claires et manteaux, barbus, cheveux courts, offrent une défense d'éléphant en
            ivoire et une grande carapace de tortue ; des fonctionnaires chinois en robes sombres les
            regardent ; l'empereur, assis au fond sur une estrade, est flou. Ne doit pas figurer : texte,
            lettre, caractère chinois, chiffre, armure de légionnaire, aigle romaine, Cité interdite, toit
            doré, objet moderne.
          alt: Des voyageurs venus de l'empire romain offrent une défense d'ivoire et une carapace de tortue à la cour chinoise.
      - picto: pot
        motCle: verre
        phrases:
          - "Des vases en verre fabriqués dans l'empire romain arrivent jusqu'en Chine : on en retrouve dans des tombes."
        enSavoirPlus: >-
          Par exemple à Luoyang, dans une tombe de l'époque des Han. En Chine, ce verre est un objet rare,
          réservé aux plus riches.
        image:
          aGenerer: >-
            Photographie réaliste, format 4:3 paysage, fond uni gris foncé, éclairage de vitrine de musée.
            Deux petits récipients en verre soufflé dans le style du verre romain du Ier siècle (sans copier
            un objet précis) : une coupe ronde bleu-vert translucide et un petit flacon à long col, légèrement
            irisés par le temps. Ne doit pas figurer : texte, lettre, chiffre, étiquette, socle avec
            inscription, verre moderne parfaitement lisse, objet en plastique.
          alt: Une coupe et un petit flacon en verre bleu-vert, dans le style du verre romain.
      - picto: piece
        motCle: or
        phrases:
          - "Pour payer la soie, le poivre et les pierres précieuses, des pièces d'or romaines partent vers l'Orient."
        enSavoirPlus: >-
          On a retrouvé dans le sud de l'Inde des pièces d'or romaines à l'image de l'empereur Auguste.
        image:
          aGenerer: >-
            Photographie réaliste, format 4:3 paysage, gros plan, fond de terre brune comme sur une fouille.
            Une dizaine de pièces d'or romaines anciennes, rondes et un peu usées, à moitié sorties de la
            terre : sur certaines, on devine le profil d'une tête d'homme. Le bord des pièces est usé, sans
            aucune lettre lisible. Lumière chaude. Ne doit pas figurer : lettre lisible, chiffre, pièce
            moderne, billet, étiquette, main avec gant, objet en plastique.
          alt: Des pièces d'or romaines anciennes à moitié sorties de la terre, avec le profil d'un empereur.
      - picto: cheval
        motCle: chevaux célestes
        phrases:
          - "Les Chinois veulent aussi les grands chevaux d'Asie centrale, qu'ils appellent les « chevaux célestes »."
        enSavoirPlus: >-
          Ils viennent de la vallée du Ferghana. Les Han envoient des caravanes chargées de soie pour les
          obtenir.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. Vers 100 av. J.-C., dans une vallée verte d'Asie
            centrale entourée de montagnes : des éleveurs d'Asie centrale, en tunique et bonnet de feutre,
            mènent trois grands chevaux élancés à la robe dorée et brillante vers un groupe de voyageurs
            chinois en robes sombres, accompagnés de chameaux chargés de ballots de soie. Ne doit pas
            figurer : texte, lettre, caractère chinois, chiffre, selle moderne, étrier (inconnu à cette époque),
            clôture moderne, objet moderne.
          alt: Des éleveurs d'Asie centrale amènent de grands chevaux dorés à des voyageurs chinois venus avec de la soie.
      - picto: temple
        motCle: bouddhisme
        phrases:
          - "Les idées voyagent aussi : le bouddhisme, une religion née en Inde, arrive en Chine par ces routes."
        enSavoirPlus: >-
          Il arrive au Ier siècle apr. J.-C., en passant par l'empire des Kouchans. Des moines traduisent
          ses livres en chinois.
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage. Vers l'an 150, sur une piste au bord du désert,
            à l'entrée de la Chine : deux moines bouddhistes venus d'Asie centrale, crâne rasé, en robes
            ocre drapées sur une épaule, marchent avec une caravane de chameaux ; l'un porte sur son dos un
            paquet de manuscrits enveloppés dans un tissu. Montagnes au loin, lumière du matin. Ne doit pas
            figurer : texte, lettre, caractère, chiffre, statue, temple moderne, drapeau, objet moderne.
          alt: Deux moines bouddhistes en robes ocre marchent avec une caravane de chameaux, au bord du désert.
      - picto: globe
        motCle: deux mondes reliés
        phrases:
          - "Rome et la Chine ne se rencontrent presque jamais, mais les routes de la soie relient leurs deux mondes."
        image:
          aGenerer: >-
            Reconstitution photoréaliste, format 4:3 paysage, image coupée en deux moitiés côte à côte par un
            mince trait blanc vertical. À gauche, à Rome vers l'an 100 : une riche Romaine en tunique claire
            déplie un tissu de soie rouge brillante venu de Chine. À droite, en Chine des Han à la même
            époque : un riche Chinois en robe sombre à larges manches lève à la lumière une coupe en verre
            bleu-vert venue de l'empire romain. Ne doit pas figurer : texte, lettre, caractère chinois,
            chiffre, carte, flèche, objet moderne.
          alt: >-
            Deux scènes côte à côte : à Rome, une femme déplie un tissu de soie chinoise ; en Chine, un homme
            regarde une coupe en verre romaine.
    questions:
      - question: Comment les Romains appellent-ils les Chinois ?
        reponse: Les Sères, le « peuple de la soie ».
      - question: Les Romains et les Chinois se rencontrent-ils souvent ?
        reponse: "Presque jamais : ils se connaissent surtout par les marchands et les intermédiaires."
      - question: Qu'est-ce qui voyage sur les routes de la soie ?
        reponse: "Des marchandises, comme la soie, le poivre, le verre et l'or, et des idées, comme le bouddhisme."
