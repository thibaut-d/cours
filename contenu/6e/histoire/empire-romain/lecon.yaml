# Leçon en brouillon : toutes les images sont à générer (description de ce qu'elles montrent).
# Programme : cycle 3, classe de 6e, thème 3 « L'empire romain dans le monde antique », sous-thème
# « Conquêtes, paix romaine et romanisation » (programme en vigueur en 6e jusqu'en 2026-2027 inclus).
# La fiche Eduscol du thème 3 demande : incarner le pouvoir impérial (Auguste, culte impérial, Trajan),
# l'armée qui maintient l'ordre et protège, le repère « Ier-IIe siècles : la pax romana », et une démarche
# inductive pour la romanisation à partir d'une cité (forum, thermes, théâtres) ; ici, Nîmes, Arles et Lyon.
# La conquête de la Gaule (vue en CM1) tient en quatre cartes au chapitre 1, avant Auguste (ordre des dates).
# Leçon précédente : « La naissance du monothéisme juif » (thème 2) ; la leçon « Rome, du mythe à
# l'histoire » s'arrête à Auguste, premier empereur en 27 av. J.-C. : celle-ci commence là.
# Leçon suivante : « Des chrétiens dans l'empire » (contenu/6e/histoire/chretiens).
titre: Conquêtes et paix romaine
public: 6e
matiere: histoire
matiereLibelle: Histoire
ordre: 8
langue: fr
statut: brouillon
resume: >-
  Un empereur pour un immense empire autour de la Méditerranée, la conquête de la Gaule, l'armée et la
  paix romaine, puis la romanisation : villes, monuments, routes, latin et citoyenneté.
sources:
  - libelle: >-
      Programme du cycle 3 en vigueur (Eduscol, d'après le BOEN n° 31 du 30 juillet 2020 et le BOEN n° 25
      du 22 juin 2023) — classe de sixième, thème 3, « Conquêtes, paix romaine et romanisation »
    url: https://eduscol.education.fr/document/50990/download
  - libelle: >-
      Eduscol, « S'approprier les différents thèmes du programme — Histoire 6e, thème 3 : L'empire
      romain dans le monde antique » (mars 2016) : Auguste empereur en 27 av. J.-C., culte impérial,
      Rome ravitaillée en blé d'Égypte et d'Afrique, armée qui maintient l'ordre et protège, Trajan
      premier empereur non italien et dernier conquérant, romanisation (forum, thermes, théâtres, Arles),
      citoyenneté étendue jusqu'à l'édit de Caracalla en 212, repère « Ier-IIe siècles : pax romana »
