# Leçon en brouillon : toutes les images sont à générer (description de ce qu'elles montrent).
# Programme : cycle 3, classe de 6e, thème 1 « La longue histoire de l'humanité et des migrations »,
# sous-thème « Premiers États, premières écritures » (programme en vigueur en 6e jusqu'en 2026-2027 inclus).
# Le programme place ce sous-thème dans l'Orient ancien : Égypte ou Mésopotamie ; la leçon montre les deux,
# la Mésopotamie pour les villes et l'écriture, l'Égypte pour le fonctionnement de l'État (fiche Eduscol).
# Leçon précédente : « La révolution néolithique » (contenu/6e/histoire/neolithique).
# Suite : thème 2, « Récits fondateurs, croyances et citoyenneté dans la Méditerranée antique » (à écrire).
titre: Premiers États, premières écritures
public: 6e
matiere: histoire
matiereLibelle: Histoire
ordre: 4
langue: fr
statut: brouillon
resume: >-
  Les premières villes de Mésopotamie, l'invention de l'écriture à Uruk et l'Égypte des pharaons, un
  des premiers États.
sources:
  - libelle: >-
      Programme du cycle 3 en vigueur (Eduscol, d'après le BOEN n° 31 du 30 juillet 2020 et le BOEN n° 25
      du 22 juin 2023) — classe de sixième, thème 1, « Premiers États, premières écritures » (Orient
      ancien : Égypte ou Mésopotamie)
    url: https://eduscol.education.fr/document/50990/download
  - libelle: >-
      Eduscol, « S'approprier les différents thèmes du programme — Histoire 6e, thème 1 » (mars 2016) :
      ville, État et écriture ; Uruk devenue une ville vers 3 500 av. J.-C. ; le « roi-prêtre » ;
      tablettes comptables ; écriture réservée aux scribes ; repère « premières écritures vers -3 500 »
    url: https://eduscol.education.fr/document/16750/download
  - libelle: >-
      Eduscol, ressources d'accompagnement d'histoire-géographie au cycle 3 : l'ancien programme reste en
      vigueur en 6e en 2026-2027, le nouveau (BO n° 22 du 28 mai 2026) s'y applique à la rentrée 2027
    url: https://eduscol.education.gouv.fr/4791/ressources-d-accompagnement-du-programme-d-histoire-et-geographie-au-cycle-3
  - libelle: >-
      BnF, Essentiels, « Naissance, vie et mort du cunéiforme » : écriture née entre 3 500 et 3 300 av.
      J.-C., plus anciens documents vers 3 300, Uruk site de référence, argile, calame de roseau
    url: https://essentiels.bnf.fr/fr/livres-et-ecritures/les-systemes-ecriture/4ab92041-e146-4582-b101-2d12bf3502b3-ecritures-en-mesopotamie/article/c510245e-aed6-4749-90e6-6cc397e659f6-naissance-vie-et-mort-cuneiforme
  - libelle: >-
      BnF, Passerelles, « La Mésopotamie, berceau de l'écriture » : jetons pour compter, tablettes
