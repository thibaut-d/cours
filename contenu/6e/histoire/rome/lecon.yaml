# Leçon en brouillon : toutes les images sont à générer (description de ce qu'elles montrent).
# Programme : cycle 3, classe de 6e, thème 2 « Récits fondateurs, croyances et citoyenneté dans la
# Méditerranée antique au Ier millénaire avant J.-C. », sous-thème « Rome du mythe à l'histoire »
# (programme en vigueur en 6e jusqu'en 2026-2027 inclus).
# Question du programme : comment le mythe de sa fondation permet-il à Rome d'asseoir sa domination, et
# comment est-il mis en scène ? La leçon suit la fiche Eduscol : le mythe (Énée, Romulus, Tite-Live,
# Virgile), sa confrontation avec l'archéologie, puis la République jusqu'à Auguste, qui se sert du mythe.
# L'empire et la paix romaine sont pour le thème 3 (autre leçon) : Auguste sert ici de charnière.
# Leçon précédente : « Le monde des cités grecques » (contenu/6e/histoire/cites-grecques).
# Leçon suivante : « La naissance du monothéisme juif » (contenu/6e/histoire/monotheisme-juif).
titre: Rome, du mythe à l'histoire
public: 6e
matiere: histoire
matiereLibelle: Histoire
ordre: 6
langue: fr
statut: brouillon
resume: >-
  Le mythe de Romulus et Rémus, ce que montrent les archéologues, puis la République romaine, ses
  conquêtes et Auguste, le premier empereur.
sources:
