# Programme : cycle 3, classe de 6e, thème 1 « La longue histoire de l'humanité et des migrations »,
# sous-thème « Les débuts de l'humanité » (programme en vigueur en 6e jusqu'en 2026-2027 inclus).
titre: Les débuts de l'humanité
niveau: 6e
matiere: histoire
matiereLibelle: Histoire
ordre: 1
langue: fr
statut: brouillon
resume: >-
  Le Paléolithique : des premiers humains en Afrique au peuplement de la Terre, la vie nomade des
  chasseurs-cueilleurs, les sépultures et l'art des grottes.
